[package]
name = "forge-infer"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
description = "A minimal LLM inference server that implements the real serving techniques: paged KV-cache, continuous batching and speculative decoding."
authors = ["Sarma <sarmalinux@gmail.com>"]
repository = "https://github.com/sarmakska/forge-infer"
readme = "README.md"

[lib]
name = "forge_infer"
path = "src/lib.rs"

[[bin]]
name = "forge-infer"
path = "src/main.rs"

[[bin]]
name = "forge-bench"
path = "src/bin/bench.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
axum = { version = "0.7", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "test-util"] }

[profile.release]
opt-level = 3
lto = "thin"
